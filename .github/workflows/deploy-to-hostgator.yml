name: Deploy to HostGator

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:  
  # Step 2: Build for production (only if tests pass)
  build:
    name: 🔨 Build for Production
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0
    
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore NuGet packages
      shell: pwsh
      run: |
        Write-Host "Restoring NuGet packages..." -ForegroundColor Cyan
        nuget restore JCarrollOnlineV2.sln
        
        if (Test-Path "packages") {
          $count = (Get-ChildItem -Path "packages" -Directory).Count
          Write-Host "✓ Restored $count packages" -ForegroundColor Green
        }
    
    - name: Clean and prepare output
      shell: pwsh
      run: |
        Write-Host "Cleaning output folders..." -ForegroundColor Cyan
        
        @("JCarrollOnlineV2\bin", "JCarrollOnlineV2\obj", "publish-output") | ForEach-Object {
          if (Test-Path $_) {
            Remove-Item -Path $_ -Recurse -Force -ErrorAction SilentlyContinue
          }
        }
        
        New-Item -ItemType Directory -Path "publish-output" -Force | Out-Null
        Write-Host "✓ Cleaned and created publish directory" -ForegroundColor Green
    
    - name: Build solution for production
      shell: pwsh
      run: |
        Write-Host "Building solution in Release configuration..." -ForegroundColor Cyan
        msbuild JCarrollOnlineV2.sln /p:Configuration=Release /p:Platform="AnyCPU" /p:DebugType=None /t:Build /v:minimal /m
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Production build failed!"
          exit 1
        }
        Write-Host "✓ Production build succeeded" -ForegroundColor Green
    
    - name: Copy files for deployment
      shell: pwsh
      run: |
        Write-Host "Copying files for deployment..." -ForegroundColor Cyan
        
        $sourceDir = "JCarrollOnlineV2"
        $destDir = "publish-output"
        
        # Copy all content files excluding build artifacts
        robocopy $sourceDir $destDir /E /XD obj .vs node_modules /XF *.csproj *.user *.sln *.pubxml /NFL /NDL /NJH /NJS /nc /ns /np
        if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }
        
        # Explicitly verify Unity WebGL files were copied
        $gamesPath = Join-Path $destDir "Content\games\Build"
        if (Test-Path $gamesPath) {
          $fileCount = (Get-ChildItem -Path $gamesPath -File).Count
          Write-Host "✓ Found $fileCount Unity WebGL files in Content/games/Build" -ForegroundColor Green
          Get-ChildItem -Path $gamesPath -File | ForEach-Object {
            Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" -ForegroundColor Gray
          }
        } else {
          Write-Warning "Unity WebGL files not found at: $gamesPath"
          Write-Host "Checking if files exist in source..." -ForegroundColor Yellow
          $sourceGamesPath = Join-Path $sourceDir "Content\games\Build"
          if (Test-Path $sourceGamesPath) {
            $sourceFileCount = (Get-ChildItem -Path $sourceGamesPath -File).Count
            Write-Host "Found $sourceFileCount files in source directory" -ForegroundColor Yellow
          } else {
            Write-Error "Unity WebGL files not found in source repository!"
            exit 1
          }
        }
        
        # Copy compiled binaries
        $binSource = Join-Path $sourceDir "bin"
        $binDest = Join-Path $destDir "bin"
        
        if (Test-Path $binSource) {
          robocopy $binSource $binDest /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -lt 8) { $global:LASTEXITCODE = 0 }
          Write-Host "✓ Files copied successfully" -ForegroundColor Green
        } else {
          Write-Error "Bin folder not found"
          exit 1
        }
    
    - name: Verify build artifacts
      id: verify-build
      shell: pwsh
      run: |
        $publishPath = "publish-output"
        Write-Host "Verifying build artifacts..." -ForegroundColor Cyan
        
        # Check critical files
        $criticalFiles = @(
          "$publishPath\Web.config",
          "$publishPath\Global.asax",
          "$publishPath\bin\JCarrollOnlineV2.dll",
          "$publishPath\bin\EntityFramework.dll"
        )
        
        $allFilesExist = $true
        foreach ($file in $criticalFiles) {
          if (-not (Test-Path $file)) {
            Write-Error "❌ Missing critical file: $file"
            $allFilesExist = $false
          } else {
            Write-Host "✓ Found: $file" -ForegroundColor Green
          }
        }
        
        if (-not $allFilesExist) {
          exit 1
        }
        
        # Verify Unity WebGL files
        $unityFiles = @(
          "$publishPath\Content\games\Build\Build.loader.js",
          "$publishPath\Content\games\Build\Build.framework.js.unityweb",
          "$publishPath\Content\games\Build\Build.wasm.unityweb"
        )
        
        foreach ($file in $unityFiles) {
          if (-not (Test-Path $file)) {
            Write-Warning "Unity file not found: $file"
          } else {
            $size = (Get-Item $file).Length
            Write-Host "✓ Found: $file ($([math]::Round($size / 1MB, 2)) MB)" -ForegroundColor Green
          }
        }
        
        Write-Host "✓ All critical files verified" -ForegroundColor Green
        
        # Store paths for next job
        $fullPath = (Resolve-Path $publishPath).Path
        echo "PUBLISH_PATH=$fullPath" >> $env:GITHUB_OUTPUT
        echo "PUBLISH_PATH_RELATIVE=$publishPath" >> $env:GITHUB_OUTPUT
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: publish-output/
        retention-days: 7
  
  # Step 2: Run unit tests
  test:
    name: 🧪 Run Unit Tests
    needs: build
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0
    
    - name: Restore NuGet packages
      shell: pwsh
      run: |
        Write-Host "Restoring NuGet packages for tests..." -ForegroundColor Cyan
        nuget restore JCarrollOnlineV2.sln
        
        # Remove System.Threading.Tasks.Extensions from packages (use framework version)
        if (Test-Path "packages\System.Threading.Tasks.Extensions.4.6.3") {
          Write-Host "Removing System.Threading.Tasks.Extensions NuGet package (using framework version)..." -ForegroundColor Yellow
          Remove-Item -Path "packages\System.Threading.Tasks.Extensions.4.6.3" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        if (Test-Path "packages") {
          $count = (Get-ChildItem -Path "packages" -Directory).Count
          Write-Host "✓ Restored $count packages" -ForegroundColor Green
        }

    
    - name: Build test project
      shell: pwsh
      run: |
        Write-Host "Building test project..." -ForegroundColor Cyan
        msbuild JCarrollOnlineV2.Test\JCarrollOnlineV2.Test.csproj /p:Configuration=Release /p:Platform="Any CPU" /t:Build /v:minimal
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Test project build failed!"
          exit 1
        }
        Write-Host "✓ Test project built successfully" -ForegroundColor Green
    
    - name: Run unit tests
      shell: pwsh
      run: |
        Write-Host "Running unit tests..." -ForegroundColor Cyan
        
        # Find vstest.console.exe
        $vstest = "${env:VSINSTALLDIR}Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        if (-not (Test-Path $vstest)) {
          $vstest = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        }
        if (-not (Test-Path $vstest)) {
          $vstest = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
        }
        
        Write-Host "Using test runner: $vstest" -ForegroundColor Gray
        
        # Find test assemblies
        $testAssemblies = Get-ChildItem -Path "JCarrollOnlineV2.Test\bin\Release" -Filter "*Test.dll" | Where-Object { $_.FullName -notlike "*\ref\*" }
        
        if ($testAssemblies.Count -eq 0) {
          Write-Error "No test assemblies found"
          exit 1
        }
        
        Write-Host "Found $($testAssemblies.Count) test assemblies:" -ForegroundColor Green
        $testAssemblies | ForEach-Object { Write-Host "  - $($_.Name)" -ForegroundColor Gray }
        
        # List dependencies to verify they're present
        Write-Host "`nChecking for System.Threading.Tasks.Extensions..." -ForegroundColor Cyan
        $taskExtensions = Get-ChildItem -Path "JCarrollOnlineV2.Test\bin\Release" -Recurse -Filter "System.Threading.Tasks.Extensions.dll"
        if ($taskExtensions) {
          Write-Host "✓ Found: $($taskExtensions.FullName)" -ForegroundColor Green
        } else {
          Write-Warning "System.Threading.Tasks.Extensions.dll not found in output directory"
        }
        
        # Run tests with InIsolation for better dependency resolution
        New-Item -ItemType Directory -Force -Path "TestResults" | Out-Null
        & $vstest $testAssemblies.FullName /Logger:trx /ResultsDirectory:TestResults /InIsolation
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Tests failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        
        Write-Host "✓ All tests passed!" -ForegroundColor Green
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/*.trx
    
    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action/composite@v2
      with:
        files: TestResults/**/*.trx
        check_name: Unit Test Results
  
  # Step 3: Deploy to HostGator (only if build succeeds AND tests pass)
  deploy:
    name: 🚀 Deploy to HostGator
    needs: [build, test]
    runs-on: windows-latest
    environment:
      name: production
      url: https://jcarrollonline.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: production-build
        path: publish-output
    
    - name: Verify downloaded artifacts
      id: find-publish
      shell: pwsh
      run: |
        $publishPath = "publish-output"
        Write-Host "Verifying downloaded artifacts..." -ForegroundColor Cyan
        
        # Check critical files exist
        $criticalFiles = @(
          "$publishPath\Web.config",
          "$publishPath\Global.asax",
          "$publishPath\bin\JCarrollOnlineV2.dll"
        )
        
        foreach ($file in $criticalFiles) {
          if (-not (Test-Path $file)) {
            Write-Error "❌ Missing critical file after download: $file"
            exit 1
          }
        }
        
        Write-Host "✓ All artifacts verified" -ForegroundColor Green
        
        # Store paths for deployment
        $fullPath = (Resolve-Path $publishPath).Path
        echo "PUBLISH_PATH=$fullPath" >> $env:GITHUB_OUTPUT
        echo "PUBLISH_PATH_RELATIVE=$publishPath" >> $env:GITHUB_OUTPUT
    
    - name: Replace secrets in Web.config
      shell: pwsh
      env:
        DEV_CONN: ${{ secrets.__DEV_CONNECTION_STRING__ }}
        PROD_CONN: ${{ secrets.__PROD_CONNECTION_STRING__ }}
        MACH_VAL: ${{ secrets.__MACHINEKEY_VALIDATION__ }}
        MACH_DEC: ${{ secrets.__MACHINEKEY_DECRYPTION__ }}
        SMTP_PWD: ${{ secrets.__SMTP_PASSWORD__ }}
      run: |
        $webConfigPath = Join-Path "${{ steps.find-publish.outputs.PUBLISH_PATH }}" "Web.config"
        
        if (-not (Test-Path $webConfigPath)) {
          Write-Error "Web.config not found at: $webConfigPath"
          exit 1
        }
        
        Write-Host "Updating Web.config..." -ForegroundColor Cyan
        [xml]$xml = Get-Content $webConfigPath
        
        # Remove configBuilders from connectionStrings
        $connStrings = $xml.configuration.connectionStrings
        if ($connStrings.HasAttribute("configBuilders")) {
          $connStrings.RemoveAttribute("configBuilders")
        }
        
        # Replace connection strings
        foreach ($add in $connStrings.add) {
          if ($add.connectionString -eq "__DEV_CONNECTION_STRING__") {
            $add.connectionString = $env:DEV_CONN
            Write-Host "✓ Replaced __DEV_CONNECTION_STRING__" -ForegroundColor Green
          }
          if ($add.connectionString -eq "__PROD_CONNECTION_STRING__") {
            $add.connectionString = $env:PROD_CONN
            Write-Host "✓ Replaced __PROD_CONNECTION_STRING__" -ForegroundColor Green
          }
        }
        
        # Remove configBuilders from appSettings and replace SMTP password
        $appSettings = $xml.configuration.appSettings
        if ($appSettings) {
          if ($appSettings.HasAttribute("configBuilders")) {
            $appSettings.RemoveAttribute("configBuilders")
            Write-Host "✓ Removed configBuilders from appSettings" -ForegroundColor Green
          }
          
          foreach ($add in $appSettings.add) {
            if ($add.value -eq "__SMTP_PASSWORD__") {
              $add.value = $env:SMTP_PWD
              Write-Host "✓ Replaced __SMTP_PASSWORD__" -ForegroundColor Green
            }
          }
        }
        
        # Handle machine keys
        $systemWeb = $xml.configuration.'system.web'
        if ($systemWeb) {
          $machineKey = $systemWeb.machineKey
          if ($machineKey) {
            if ($machineKey.validationKey -eq "__MACHINEKEY_VALIDATION__") {
              $machineKey.validationKey = $env:MACH_VAL
              Write-Host "✓ Replaced __MACHINEKEY_VALIDATION__" -ForegroundColor Green
            }
            if ($machineKey.decryptionKey -eq "__MACHINEKEY_DECRYPTION__") {
              $machineKey.decryptionKey = $env:MACH_DEC
              Write-Host "✓ Replaced __MACHINEKEY_DECRYPTION__" -ForegroundColor Green
            }
          }
          
          # Set debug=false
          $compilation = $systemWeb.compilation
          if ($compilation -and $compilation.debug -eq "true") {
            $compilation.debug = "false"
            Write-Host "✓ Set debug=false" -ForegroundColor Green
          }
        }
        
        # Handle legacy system.net SMTP password (if still in use)
        $systemNet = $xml.configuration.'system.net'
        if ($systemNet -and $systemNet.mailSettings -and $systemNet.mailSettings.smtp -and $systemNet.mailSettings.smtp.network) {
          $network = $systemNet.mailSettings.smtp.network
          if ([string]::IsNullOrEmpty($network.password) -or $network.password -eq "__SMTP_PASSWORD__") {
            $network.password = $env:SMTP_PWD
            Write-Host "✓ Replaced legacy __SMTP_PASSWORD__" -ForegroundColor Green
          }
        }
        
        # Save with UTF-8 encoding
        $settings = New-Object System.Xml.XmlWriterSettings
        $settings.Indent = $true
        $settings.IndentChars = "  "
        $settings.Encoding = [System.Text.Encoding]::UTF8
        
        $writer = [System.Xml.XmlWriter]::Create($webConfigPath, $settings)
        $xml.Save($writer)
        $writer.Close()
        
        # Verify no placeholders remain
        [xml]$verify = Get-Content $webConfigPath
        $placeholderPattern = '__[A-Z_]+__'
        
        foreach ($add in $verify.configuration.connectionStrings.add) {
          if ($add.connectionString -match $placeholderPattern) {
            Write-Error "Placeholder still exists in connection string: $($add.name)"
            exit 1
          }
        }
        
        foreach ($add in $verify.configuration.appSettings.add) {
          if ($add.value -match $placeholderPattern) {
            Write-Error "Placeholder still exists in appSettings: $($add.key) = $($add.value)"
            exit 1
          }
        }
        
        Write-Host "✓ Web.config successfully updated and verified" -ForegroundColor Green
    
    - name: Deploy to HostGator via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: mentatdewd
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ${{ steps.find-publish.outputs.PUBLISH_PATH_RELATIVE }}/
        server-dir: /httpdocs/jcarrollonline/
        dangerous-clean-slate: false
        log-level: standard
        exclude: |
          **/.git*
          **/.git*/**
          **/secrets.xml
          **/*.pdb
          **/packages.config
          **/upgrade.log
          **/.vs/**
          **/Web.Release.config
          **/Web.Debug.config
    
    - name: Deployment summary
      if: success()
      shell: pwsh
      run: |
        Write-Host "================================" -ForegroundColor Green
        Write-Host "  DEPLOYMENT SUCCESSFUL! 🚀" -ForegroundColor Green
        Write-Host "================================" -ForegroundColor Green
        Write-Host ""
        Write-Host "Environment: Production (HostGator)" -ForegroundColor Cyan
        Write-Host "Branch: $env:GITHUB_REF_NAME" -ForegroundColor Cyan
        Write-Host "Commit: $env:GITHUB_SHA" -ForegroundColor Cyan
        Write-Host "Deployed by: $env:GITHUB_ACTOR" -ForegroundColor Cyan
        Write-Host ""
        
        # Add to GitHub step summary
        Add-Content $env:GITHUB_STEP_SUMMARY "### Deployment Complete! :rocket:"
        Add-Content $env:GITHUB_STEP_SUMMARY ""
        Add-Content $env:GITHUB_STEP_SUMMARY "| Property | Value |"
        Add-Content $env:GITHUB_STEP_SUMMARY "|----------|-------|"
        Add-Content $env:GITHUB_STEP_SUMMARY "| **Environment** | Production (HostGator) |"
        Add-Content $env:GITHUB_STEP_SUMMARY "| **Branch** | $env:GITHUB_REF_NAME |"
        Add-Content $env:GITHUB_STEP_SUMMARY "| **Commit** | $env:GITHUB_SHA |"
        Add-Content $env:GITHUB_STEP_SUMMARY "| **Deployed by** | $env:GITHUB_ACTOR |"
        Add-Content $env:GITHUB_STEP_SUMMARY "| **URL** | https://jcarrollonline.com |"